number: 1
title: "Going Round in Circles"
chapter: "voltage-current-resistance"
introduces: ["circuit"]
practises: []
steps:
  - "Connect the bulb to both terminals of the battery compartment, so that the current has a complete loop to travel round."
  - "Look carefully at what you have built. Can you trace the path the current takes?"
whatHappens:
  - "As soon as every contact is closed the bulb lights up. You have built a closed circuit: current flows out of the battery, through the bulb, and straight back into the battery."
  - "Now take one of the connector strips away. The current cannot flow any more and the bulb goes out. You have broken the circuit."
eli5:
  - "The bulb lights because you have made a complete ring, all the way from one end of the battery, through the bulb, and back to the other end."
  - "Take any piece out and there is a gap in the ring. Nothing gets round, so the bulb goes dark. It is not the bulb that stopped working. It is the ring that stopped being a ring."
sidebar:
  heading: "Electrical voltage"
  body:
    - "The battery makes a voltage. At one of its terminals there are too few electrons, and at the other there are too many. That difference is what pushes the current round."
    - "A voltage like this one, with a fixed plus terminal and a fixed minus terminal, is called a direct voltage."
    - "If a voltage source swapped its two terminals over again and again, very fast, it would be making an alternating voltage instead. That is what comes out of the sockets in your wall."
