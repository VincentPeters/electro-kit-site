number: 24
title: "A Current Splits in Two"
chapter: "series-parallel-mixed"
introduces: []
practises: ["parallel", "current"]
steps:
  - "Set the meter up to measure current, with its switch at 1A."
  - "Switch on. Both bulbs light."
  - "The meter shows the current flowing in the whole circuit: about 0.38 amperes."
whatHappens:
  - "Here you are measuring the total current, meaning everything the batteries have to supply so that both bulbs can light."
  - "It is exactly as large as the two branch currents added together."
  - "You can check that for yourself by adding up the two readings you noted in experiment 22."
