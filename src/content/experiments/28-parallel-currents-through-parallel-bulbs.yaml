number: 28
title: "Parallel Currents through Parallel Bulbs"
chapter: "series-parallel-mixed"
introduces: []
practises: ["parallel", "current"]
steps:
  - "Set the meter up to measure current, with its switch at 1A."
  - "Switch on. All three bulbs light and the meter shows the total current, about 0.57 amperes. Write it down."
  - "Now rebuild the circuit to build plans 2, 3 and 4 in turn, so that you measure the current through each bulb separately."
  - "Write down the current each time."
whatHappens:
  - "After the experiments you have already done, you probably know what is coming: in a parallel circuit the total current is as big as all the branch currents added together."
  - "You can check it. Add up the three currents you measured for the separate bulbs."
  - "The answer has to match the total current you measured first."
