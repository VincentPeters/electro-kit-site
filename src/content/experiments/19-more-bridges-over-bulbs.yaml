number: 19
title: "More Bridges over Bulbs"
chapter: "series-parallel-mixed"
steps:
  - "Set the meter to 3V and switch on. All three bulbs light and the needle swings to about 1 volt."
  - "Press the left-hand button. Its bulb goes out and the meter reads about 1.5 volts."
  - "Press the other button instead. The meter reads 1.5 volts again and the bulb above that button goes out."
  - "Now press both buttons at once. The meter reads about 3 volts and the one remaining bulb glows brightly."
whatHappens:
  - "With all three bulbs lit, the voltage splits into three equal shares of about 1 volt each."
  - "Bridge one bulb with a button and the voltage divides between the two that are left, giving each of them about 1.5 volts."
  - "Press both buttons and the single remaining bulb gets the whole battery voltage of about 3 volts."
