number: 56
title: "Stop, Thief!"
chapter: "relay"
introduces: []
practises: ["relay", "magnetism", "switching"]
steps:
  - "Close the circuit at the minus terminal of the battery compartment. The buzzer raises the alarm straight away."
  - "The sound only stops when you bring the magnet close enough to the magnetic switch."
  - "Take the magnet away and the alarm sounds again."
  - "You could guard something with this. Fix a magnet underneath it and put the magnetic switch where it stands. Take the object away and the alarm goes off."
whatHappens:
  - "One connection of the buzzer reaches the battery through the rest contact of the relay. The other goes straight to the battery, so the buzzer has the full battery voltage across it and sounds."
  - "Bring the magnet close and the magnetic switch closes, which switches on the relay coil."
  - "The relay switches over, the buzzer connection leaves the rest contact, and the sound stops."
