number: 16
title: "A String of Lights"
chapter: "series-parallel-mixed"
steps:
  - "Switch on and all three bulbs light up."
  - "Switch off and all three go out together."
  - "You have built a string of Christmas tree lights. Only yours has three lights rather than the fifteen or more on a real one."
whatHappens:
  - "In this series circuit three bulbs have to share the 3 volts between them."
  - "How much voltage do you think each one gets? Remember that all three bulbs are electrically almost identical."
  - "You can find out whether you guessed right in the next experiment."
