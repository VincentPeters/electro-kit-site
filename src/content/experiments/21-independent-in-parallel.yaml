number: 21
title: "Independent in Parallel"
chapter: "series-parallel-mixed"
introduces: ["parallel"]
practises: ["circuit", "series"]
steps:
  - "Switch on and both bulbs light up."
  - "Now try unscrewing one bulb from its holder while the circuit is still switched on."
whatHappens:
  - "When one part of a parallel circuit fails, current can still flow through the other one, so it carries on working."
  - "Unlike the series circuit, the second bulb keeps shining when you unscrew the first."
  - "That is why your bike headlamp still works when the rear light has burnt out."
