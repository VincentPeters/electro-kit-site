number: 57
title: "The Purring Relay"
chapter: "relay"
introduces: []
practises: ["relay", "circuit", "switching"]
steps:
  - "Press the button. The relay makes a purring sound."
  - "Let the button go and the noise stops."
whatHappens:
  - "The relay coil is joined to the battery through the button and through the relay's own rest contact. Press the button and the relay switches on."
  - "But at the very moment it switches, it breaks the circuit to its own coil."
  - "So the contacts fall back to rest. Now current can flow through the rest contact again, and the relay switches once more. That rapid switching, over and over, is the purring sound you hear."
note: "Old electric doorbells and old car horns worked on very much this principle."
boards:
  - caption: "The relay switches itself off, over and over"
