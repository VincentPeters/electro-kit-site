number: 18
title: "A Bridge over the Bulb"
chapter: "series-parallel-mixed"
steps:
  - "Set the meter to 3V."
  - "Switch on. Both bulbs light and the needle swings to about 1.5 volts."
  - "Press the button. One bulb goes out, the other glows brighter, and the meter climbs to about 3 volts."
  - "Let the button go and the needle drops back to 1.5 volts with both bulbs lit again."
whatHappens:
  - "While both bulbs are lit, the battery voltage is shared equally between them."
  - "The button lets you build a bridge over one bulb, short-circuiting it. Current takes the easy path through the button instead of through the bulb, so that bulb goes dark."
  - "Now the remaining bulb has the full 3 volts to itself, which is exactly why it glows so much brighter."
