number: 26
title: "The Motor Makes a Difference"
chapter: "series-parallel-mixed"
introduces: []
practises: ["parallel", "current"]
steps:
  - "Set the meter to 1A, because here too it is measuring a current."
  - "Switch on. The bulb lights and the motor turns."
  - "The meter shows the total current: about 0.40 amperes."
whatHappens:
  - "Here again the total current is the sum of the currents through the bulb and through the motor."
  - "You can work out the motor current by taking the bulb current away from the total."
  - "The answer should come to about 0.21 amperes."
