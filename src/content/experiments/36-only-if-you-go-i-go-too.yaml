number: 36
title: "Only If You Go, I Go Too"
chapter: "switching"
introduces: []
practises: ["series", "switching", "circuit"]
steps:
  - "The bulb only lights when you press the left button AND the right button at the same time."
  - "Try pressing just one of them. Nothing happens."
  - "A circuit like this is called an AND gate."
whatHappens:
  - "An AND gate is really just a series circuit."
  - "Current can only flow once both buttons in the chain are closed. One open button anywhere breaks the whole path."
  - "AND gates are used on machines where the worker has to press a button with each hand. That makes sure the machine cannot start by accident, and that both hands are safely out of the dangerous part."
