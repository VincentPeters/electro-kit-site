number: 52
title: "A Magnet Raises the Alarm"
chapter: "magnetism"
introduces: []
practises: ["magnetism", "switching"]
steps:
  - "Bring a narrow end of the magnet towards the magnetic switch. As soon as it is close enough, the buzzer sounds."
  - "Take the magnet away from the switch again and the sound stops."
  - "You could use a circuit like this for a simple burglar alarm."
whatHappens:
  - "Here you are switching something on with the magnet once more, this time the buzzer."
  - "Magnetic switches are built into a great many real alarm systems."
  - "One can be fitted into a window frame with the magnet on the window itself, and wired to an alarm. Open the window, the magnet moves away, and the alarm goes off."
boards:
