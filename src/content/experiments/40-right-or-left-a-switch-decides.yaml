number: 40
title: "Right or Left: a Switch Decides"
chapter: "switching"
steps:
  - "Put both changeover switches at C and press the button. The motor runs."
  - "Now put both changeover switches at B. Press the button and the motor runs the other way."
  - "Put the two switches in different positions. Now you can press the button as much as you like and the motor will not turn at all."
whatHappens:
  - "The motor is wired between the middle contacts of the two changeover switches. The switching contacts of the two switches are joined to each other, and each pair also goes to one terminal of the battery."
  - "Depending on where the switches are, the motor is joined through the left switch to plus and through the right switch to minus. Flip both switches and the polarity reverses: now it is minus on the left and plus on the right."
  - "Because the polarity decides which way a motor turns, this circuit lets you change its direction. With the switches in different positions both motor connections end up on the same battery terminal, so it cannot turn at all."
note: "You could use a circuit like this to drive a model boat or car forwards and backwards."
