number: 25
title: "It Flows through Bulb and Coil"
chapter: "series-parallel-mixed"
introduces: []
practises: ["parallel", "current"]
steps:
  - "Set the meter to 1A."
  - "Switch on and the bulb lights."
  - "At the same time the meter shows the current flowing in the whole circuit: about 0.39 amperes."
whatHappens:
  - "Once again you are measuring the total current, and once again it is as large as the two branch currents added together, this time through the bulb and through the coil."
  - "Check it against your notes from experiment 23. Add the bulb current to the coil current."
  - "The answer should match the reading you get here."
