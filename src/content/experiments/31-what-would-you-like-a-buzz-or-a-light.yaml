number: 31
title: "What Would You Like: A Buzz or a Light?"
chapter: "switching"
introduces: []
practises: ["switching", "circuit"]
steps:
  - "Close the circuit at the minus terminal with the two-contact strip. Either the bulb lights or the buzzer sounds."
  - "Work the changeover switch. Either the bulb goes out and the buzzer starts, or the buzzer stops and the bulb lights."
  - "Work the switch a second time and it swaps back between bulb and buzzer."
whatHappens:
  - "This circuit works exactly like the one in experiment 30. The only difference is that the buzzer has taken the place of the second bulb."
  - "The changeover switch closes the circuit either for the bulb or for the buzzer."
  - "It can never close both at once, because the middle contact can only ever be joined to one side."
