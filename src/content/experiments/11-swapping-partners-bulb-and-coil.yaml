number: 11
title: "Swapping Partners: Bulb and Coil"
chapter: "series-parallel-mixed"
introduces: ["resistance"]
practises: ["series", "voltage"]
steps:
  - "Push the switch to ON. The bulb lights, but only faintly."
  - "Push the switch to OFF and it goes out again."
whatHappens:
  - "With the bulb and the coil in series, the bulb only glows weakly."
  - "That is down to the coil, which puts up a large resistance to the current."
  - "So there is less voltage left over for the bulb, and less voltage means a dimmer light."
eli5:
  - "The coil is hard work for the current, like the muddy stretch on the running track. That is resistance."
  - "Taking the biggest share of the fight, the coil leaves only a little shove for the bulb, so it glows faintly."
