number: 14
title: "Nothing New at the Second Bulb?"
chapter: "series-parallel-mixed"
steps:
  - "Set the meter to 3V before you switch on."
  - "Switch on. Both bulbs light and the needle swings to about 1.5 volts again, just as it did last time."
whatHappens:
  - "Just as in the previous experiment, you are measuring the voltage across one bulb in a series circuit. This time it is the other bulb."
  - "The reading is almost exactly the same as in experiment 13, because the two bulbs in your kit are electrically identical."
  - "So the two bulbs share the voltage out fairly between them."
