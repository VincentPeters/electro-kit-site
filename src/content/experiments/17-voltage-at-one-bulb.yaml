number: 17
title: "Voltage at One Bulb"
chapter: "series-parallel-mixed"
steps:
  - "Before you switch on, set the meter to 3V."
  - "Switch on. All three bulbs light and the needle swings to about 1 volt."
  - "Now measure the voltage across two bulbs, and then across all three, by rebuilding the circuit to build plans 2 and 3. Write down each reading."
whatHappens:
  - "First you measure the voltage available to one bulb. It is about 1 volt."
  - "Because the three bulbs are electrically almost identical, the 3 volts from the battery splits equally between them."
  - "Across two bulbs you should read about 2 volts, and across all three about 3 volts, which is the full battery voltage."
