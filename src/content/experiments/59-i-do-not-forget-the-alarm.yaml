number: 59
title: "I Do Not Forget the Alarm"
chapter: "relay"
introduces: []
practises: ["relay", "magnetism", "switching", "series"]
steps:
  - "Close the circuit at the plus terminal of the battery compartment. The buzzer sounds straight away."
  - "Bring the magnet close enough to the magnetic switch for it to close, then tap the button briefly. The relay pulls in and the buzzer goes quiet."
  - "Take the magnet away and the buzzer sounds again. It does not stop, even if you hold the magnet back against the magnetic switch."
  - "Hold the magnet at the magnetic switch and press the button. Now the buzzer goes quiet again."
whatHappens:
  - "The plus side of the buzzer goes straight to the battery. Its minus side reaches the battery through the middle contact and the rest contact of the relay, so the buzzer sounds whenever the relay is at rest."
  - "The relay coil has one connection to the battery and the other through the button. Press the button and the relay pulls in. That joins the battery, through the middle contact and the work contact, to the magnetic switch."
  - "If the magnetic switch is open, nothing further happens and the relay only stays in while you hold the button. But if a magnet is holding the magnetic switch closed, current can reach the relay coil through it, so the relay stays pulled in and the buzzer stays quiet."
  - "Take the magnet away and the magnetic switch opens, the coil loses its voltage and the relay drops out. From then on it can only pull in again when the magnetic switch is closed and the button is tapped at the same moment. The alarm does not forget."
boards:
  - caption: "The alarm latches: the magnet alone will not reset it"
