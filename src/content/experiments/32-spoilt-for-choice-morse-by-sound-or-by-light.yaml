number: 32
title: "Spoilt for Choice: Morse by Sound or by Light"
chapter: "switching"
introduces: []
practises: ["switching", "series", "circuit"]
steps:
  - "Tap the push button. Either the bulb flashes or the buzzer sounds, in exactly the rhythm you tap."
  - "Work the changeover switch to swap between the buzzer and the bulb."
  - "Now you can send Morse code either way, as a light or as a sound."
whatHappens:
  - "This circuit works just like the ones in experiments 30 and 31."
  - "The difference is the push button. It opens and closes the circuit no matter where the changeover switch happens to be."
  - "So the changeover switch chooses which one speaks, and the button decides when."
note: "The Morse alphabet is in experiment 3, if you need to look up a letter."
