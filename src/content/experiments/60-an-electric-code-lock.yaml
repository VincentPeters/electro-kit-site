number: 60
title: "An Electric Code Lock"
chapter: "relay"
introduces: []
practises: ["relay", "switching", "series", "parallel"]
steps:
  - "First set the right code: both changeover switches have to be at B."
  - "Put the on/off switch at ON and press the right-hand button. The bulb lights for as long as you hold it. The lock is open."
  - "Press the left-hand button instead, or leave either changeover switch in the wrong position, and the buzzer raises the alarm the moment you put the on/off switch to ON."
  - "The alarm keeps sounding until you put the on/off switch back to OFF."
whatHappens:
  - "The buzzer and the relay coil are wired side by side, each with one connection to the minus terminal. The on/off switch joins the middle contact of the left changeover to the plus terminal, and so does the work contact of the relay."
  - "If that left switch is at C, the battery voltage reaches the relay coil directly: the relay pulls in and the buzzer sounds. It stays on, because it now feeds itself through its own work contact and middle contact."
  - "If the left switch is at B, the battery voltage reaches the two buttons instead. Press the left button and the voltage gets back to the relay coil, so the alarm goes off. Press the right button and the voltage reaches the middle contact of the right changeover. If that one is at C, the alarm sounds again."
  - "Only when the right changeover is at B and you press the right button does the voltage reach the bulb. It lights, because its other connection goes straight to the minus terminal."
note: "This is the biggest build in the book. Work through it one level at a time and check each part before you switch on."
