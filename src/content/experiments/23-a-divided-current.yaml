number: 23
title: "A Divided Current"
chapter: "series-parallel-mixed"
introduces: []
practises: ["parallel", "current", "resistance"]
steps:
  - "Set the meter to 1A before you switch on."
  - "Switch on. The bulb lights and the needle swings to about 0.20 amperes. Write it down: that is the current through the coil."
  - "Rebuild the circuit to build plan 2. Now you are measuring the current through the bulb."
  - "Switch on again. The needle reads about 0.19 amperes. Compare it with your first reading."
whatHappens:
  - "This is the same circuit as the last one, except that you measure the coil current first and the bulb current after rebuilding."
  - "Compare the two: a slightly larger current flows through the coil than through the bulb."
  - "That is because the coil has a different, slightly smaller resistance than the bulb."
eli5:
  - "The two lanes are not identical here: one has the coil, one has the bulb. In this circuit the coil lets a bit more current past than the bulb does."
  - "Each lane still gets the whole 3 volts. Only the current comes out different this time."
