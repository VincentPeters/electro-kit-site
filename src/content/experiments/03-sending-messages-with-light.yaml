number: 3
title: "Sending Messages with Light"
chapter: "voltage-current-resistance"
steps:
  - "Tap the push button. The bulb flashes in exactly the rhythm you tap."
  - "Every letter and every number has its own pattern of short and long flashes. Sending a message that way is called Morse code."
  - "In the Morse alphabet a dot means press the button briefly, and a dash means hold it down a little longer. Try sending your name to someone across the room."
whatHappens:
  - "A push button closes and breaks a circuit, just as the switch did."
  - "It has two contacts that are only pressed together while you are holding the button down."
  - "Let go and the contacts spring apart again. That is why the current can only flow for exactly as long as you keep pressing."
