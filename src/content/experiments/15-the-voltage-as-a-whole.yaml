number: 15
title: "The Voltage as a Whole"
chapter: "series-parallel-mixed"
introduces: []
practises: ["series", "voltage"]
steps:
  - "Set the meter to 3V so that it measures a voltage."
  - "Switch on. Both bulbs light and the needle swings up to about 3 volts."
whatHappens:
  - "Here you are measuring the voltage right at the batteries, and it comes to about 3 volts."
  - "That is exactly the sum of the two voltages you measured across the bulbs in the last two experiments: 1.5 plus 1.5."
  - "So two electrically identical bulbs share the 3 volts of the battery equally between them."
