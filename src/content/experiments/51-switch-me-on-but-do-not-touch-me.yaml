number: 51
title: "Switch Me On, but Do Not Touch Me"
chapter: "magnetism"
steps:
  - "Bring one of the narrow ends of the magnet slowly towards the magnetic switch."
  - "As soon as the magnet is close enough, the electric motor starts to turn."
  - "It keeps turning until you take the magnet away again."
whatHappens:
  - "Once again you are switching something on with the magnet rather than with your finger."
  - "Plenty of everyday things work this way. Bicycle speedometers, for example, use a magnetic switch and a magnet on a spoke."
  - "Every time the wheel goes round, the magnet passes the switch and the speedometer counts one turn."
