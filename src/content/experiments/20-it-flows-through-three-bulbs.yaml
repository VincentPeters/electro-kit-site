number: 20
title: "It Flows through Three Bulbs"
chapter: "series-parallel-mixed"
introduces: []
practises: ["short-circuit", "series", "resistance", "current"]
steps:
  - "Set the meter to 1A."
  - "Switch on. All three bulbs light and the meter reads about 0.12 amperes."
  - "Press the left-hand button. That bulb goes out and the meter shows a higher current."
  - "Press the other button and the current rises a little again while that bulb goes out."
  - "Press both buttons at once: the meter reads about 0.19 amperes and one bulb glows brightly."
whatHappens:
  - "While the bulbs are lit the same current flows through all of them. Bridge one or both with a button and the current only rises a little, because its size depends on the resistance of the bulbs."
  - "That resistance depends on how many bulbs there are. In a series circuit the separate resistances add up into one total resistance, and that total decides the current."
  - "Pressing a button takes a bulb out of the chain, which lowers the total resistance, so a larger current flows."
