number: 22
title: "Parallel Currents"
chapter: "series-parallel-mixed"
introduces: []
practises: ["parallel", "current"]
steps:
  - "Set the meter to 1A before you switch on."
  - "Switch on. Both bulbs light and the needle swings to about 0.19 amperes. Write the reading down."
  - "Now rebuild the circuit to build plan 2, which measures the current through the second bulb instead."
  - "Switch on again, note the second reading, and compare it with the first."
whatHappens:
  - "In this experiment you measure the current flowing through each bulb in turn. The two values are almost the same."
  - "That is because the two bulbs are electrically identical, so each branch takes an equal share."
  - "Keep your notes. You will want to compare these numbers with the ones from the next few experiments."
