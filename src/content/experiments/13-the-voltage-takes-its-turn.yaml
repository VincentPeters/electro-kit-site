number: 13
title: "The Voltage Takes Its Turn"
chapter: "series-parallel-mixed"
steps:
  - "Set the meter to 3V before you switch on."
  - "Switch on. Both bulbs light and the meter reads about 1.5 volts on the upper scale."
whatHappens:
  - "In experiment 6 you measured the battery voltage and got about 3 volts. Here you are measuring the voltage available to just one bulb in the series circuit."
  - "It is about half the battery voltage."
  - "That is why the bulb cannot shine as brightly as it would if it had the whole voltage to itself."
boards:
