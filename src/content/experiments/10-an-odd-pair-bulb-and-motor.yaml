number: 10
title: "An Odd Pair: Bulb and Motor"
chapter: "series-parallel-mixed"
introduces: []
practises: ["series", "voltage", "circuit"]
steps:
  - "Push the switch to ON. The bulb lights up and the motor turns."
  - "Switch off and the bulb goes out and the motor stops."
  - "Do you know what happens if you unscrew the bulb from its holder? Try it."
whatHappens:
  - "In this series circuit the current flows out of the battery, through the bulb, and on through the motor."
  - "Because the motor and the bulb have to share the voltage between them, the bulb does not glow as brightly as it would if it were connected straight to the battery."
  - "And if you unscrew the bulb, the motor stops. One path, one break, everything stops."
