name: "Voltage"
order: 3
oneLiner: "Voltage is the size of the shove the battery gives, and nothing else."
eli5:
  - "A battery has one job. It shoves. Voltage is the word for how hard it shoves."
  - "Back on the running track, voltage is how hard the runners are pushed off the start line. A harder shove will get them round a difficult track that a gentle shove could never manage."
  - "Your kit gives 3 volts, which is a gentle shove. Two batteries of 1.5 volts each sit in the baseplate, one after the other, and their shoves add up. The sockets in the wall give 230 volts, a shove hard enough to kill you, which is why you never go anywhere near them."
  - "Be careful about what voltage is not. A big shove does not mean anything is going fast, and it does not mean a lot of it is going. It only means it is being pushed hard. What actually moves is the next idea along."
